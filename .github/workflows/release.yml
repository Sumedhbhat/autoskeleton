name: Release

# Nightly prereleases come from main and stable releases from release/X.Y
# branches. package.json is the only place the version is written: CI adds
# -nightly.<run> for main builds in its own checkout and never commits it.
#
# npm publishing is opt-in: set the repository variable NPM_PUBLISH=true. Until
# then the GitHub releases are still created. While the NPM_CI_TOKEN secret
# exists, CI stages each version with `npm stage publish` and a maintainer
# approves it with 2FA on npmjs.com. That is how the package is first created.
# Once the package exists, configure a trusted publisher for this workflow on
# npmjs.com and delete NPM_CI_TOKEN: CI then publishes directly over OIDC.

on:
  push:
    branches: [main, "release/**"]
  pull_request:

permissions:
  contents: read

env:
  PACKAGE: "@autoskeleton/react"

concurrency:
  group: release-${{ github.ref }}
  # Let every push to a release branch finish so no patch release is skipped.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/heads/release/') }}

jobs:
  version:
    name: Determine version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.version.outputs.channel }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Determine version and channel
        id: version
        run: |
          manifest="$(node -p 'require("./package.json").version')"
          case "$GITHUB_REF" in
            refs/heads/release/*)
              line="${GITHUB_REF#refs/heads/release/}"
              case "$line" in
                *.*.*) echo "Name release branches release/<major>.<minor>, not release/$line." >&2; exit 1 ;;
              esac
              case "$manifest" in
                "$line".*) ;;
                *) echo "package.json version $manifest does not belong to release/$line." >&2; exit 1 ;;
              esac
              channel=stable
              version="$manifest"
              ;;
            refs/heads/main)
              channel=nightly
              version="$manifest-nightly.$GITHUB_RUN_NUMBER"
              ;;
            *)
              channel=none
              version="$manifest-dev.$GITHUB_RUN_NUMBER"
              ;;
          esac
          echo "Building $version ($channel)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

  package:
    name: Build package
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TARBALL: autoskeleton-react-${{ needs.version.outputs.version }}.tgz
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Stamp version
        run: |
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          echo "$VERSION" > VERSION

      - name: Build
        run: npm run build

      - name: Verify package
        run: |
          npm run test:ssr
          npm run check:package
          test "$(node -p 'require("./dist/index.cjs").version')" = "$VERSION"

      - name: Pack
        run: |
          mkdir -p out
          npm pack --pack-destination out
          tar -xOzf "out/$TARBALL" package/VERSION | grep -qx "$VERSION"
          (cd out && sha256sum autoskeleton-react-*.tgz > SHA256SUMS && cat SHA256SUMS)

      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: out/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish ${{ needs.version.outputs.channel }} release
    needs: [version, package]
    if: github.event_name == 'push' && needs.version.outputs.channel != 'none'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write # npm provenance / trusted publishing
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.version.outputs.version }}
      TARBALL: autoskeleton-react-${{ needs.version.outputs.version }}.tgz
      CHANNEL: ${{ needs.version.outputs.channel }}
    steps:
      - name: Download package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: out

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Create GitHub release
        run: |
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::notice::$tag is already released. Bump the patch version in package.json to publish a fix."
            exit 0
          fi
          prerelease=""
          [ "$CHANNEL" = nightly ] && prerelease="--prerelease"
          notes="Install with: npm install $PACKAGE@$VERSION"
          gh release create "$tag" out/* --target "$GITHUB_SHA" --title "autoskeleton $VERSION" \
            --notes "$notes" --generate-notes $prerelease

      - name: Publish to npm
        if: vars.NPM_PUBLISH == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_CI_TOKEN }}
        run: |
          # Staged publishing needs npm 11.15.0 or newer.
          node -e 'const [a, b] = process.argv[1].split(".").map(Number); process.exit(a > 11 || (a === 11 && b >= 15) ? 0 : 1)' "$(npm --version)" ||
            { echo "::error::npm $(npm --version) is too old for staged publishing (needs 11.15.0+)."; exit 1; }
          if npm view "$PACKAGE@$VERSION" version >/dev/null 2>&1; then
            echo "::notice::$PACKAGE@$VERSION is already on npm."
            exit 0
          fi
          tag=latest
          [ "$CHANNEL" = nightly ] && tag=nightly
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            # Tokens can only stage a publish; a maintainer approves it with 2FA.
            npm stage publish "./out/$TARBALL" --tag "$tag" --access public --provenance
            echo "::notice::Staged $PACKAGE@$VERSION. Approve it on npmjs.com under Staged Packages, or run npm stage list $PACKAGE then npm stage approve <stage-id>."
          else
            npm publish "./out/$TARBALL" --tag "$tag" --access public --provenance
          fi

      - name: npm publishing disabled
        if: vars.NPM_PUBLISH != 'true'
        run: echo "::notice::Skipped npm publish. Set the NPM_PUBLISH repository variable to true to enable it."
