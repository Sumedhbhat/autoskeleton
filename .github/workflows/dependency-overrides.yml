name: Dependency overrides

on:
  schedule:
    - cron: "17 6 * * *" # daily
  push:
    branches: [main]
    paths: [package-lock.json] # right after a parent bump lands
  pull_request:
    paths: [package.json, .github/dependency-overrides.yml]
  workflow_dispatch:

jobs:
  # On PRs: every override has a complete ledger entry, and every ledger entry has an override.
  ledger:
    name: Override ledger
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Overrides and ledger match
        run: |
          diff -u \
            <(yq -r '.overrides[] | select(.ecosystem == "npm") | .package' .github/dependency-overrides.yml | sort) \
            <(jq -r '.overrides // {} | keys[]' package.json | sort)

      - name: Ledger entries are complete
        run: |
          if yq -e '.overrides[] | select(.fixed_in == null or .advisory == null or .reason == null or .owner == null or .added == null)' .github/dependency-overrides.yml; then
            echo "::error::Every ledger entry needs fixed_in, advisory, reason, owner and added"
            exit 1
          fi

  # Everywhere else: try removing each override and open PRs for the ones that can go.
  remove:
    name: Remove unneeded overrides
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read # writes go through DEPS_BOT_TOKEN
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.DEPS_BOT_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*

      - name: Configure git
        run: |
          git config user.name "deps-bot"
          git config user.email "deps-bot@users.noreply.github.com"

      - name: Check overrides
        run: scripts/check-npm-overrides.sh --open-prs
        env:
          GH_TOKEN: ${{ secrets.DEPS_BOT_TOKEN }}
